# yaml-language-server: $schema=https://raw.githubusercontent.com/karoterra/aviutl2-aulua/refs/heads/main/schema/aulua.schema.json

project:
  variables:
    AUTHOR: karoterra

build:
  out_dir: build

install:
  out_dir: C:\ProgramData\aviutl2\Script\karoterra\

package:
  id: Karoterra.OilPainting
  name: 油絵KR
  information: 油絵KR for AviUtl2 v{version} by {AUTHOR}
  version: 1.1.0
  uninstall_sub_folder_file: false
  file_name: "{id}-v{version}.au2pkg.zip"
  script_sub_dir: "{id}"
  message:
    text: |
      # 油絵KR

      油絵風の効果を適用するスクリプト

      以下のフィルタが追加されます。
      - 加工\油絵KR

      公開ページ
      https://github.com/karoterra/aviutl2-OilPainting

      紹介動画
      https://www.nicovideo.jp/watch/sm39051118
  assets:
    - dest: Script/{id}/README.md
      src: README.md
    - dest: Script/{id}/LICENSE
      src: LICENSE

scripts:
  - name: 油絵KR.anm2
    sources:
      - path: script/油絵.in.anm2
        variables:
          INFO: 油絵KR for AviUtl2
